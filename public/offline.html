<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Sangam Diagnostics</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 36px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      max-width: 440px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 22px; color: #0b3866; margin: 16px 0 8px; }
    p { font-size: 14px; color: #64748b; line-height: 1.5; margin: 0 0 24px; }
    .btn {
      display: inline-block;
      background: #0b3866;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .phone {
      margin-top: 20px;
      font-size: 13px;
      color: #475569;
    }
    .phone a { color: #00a896; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#00a896" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22"></path>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <h1>You are Currently Offline</h1>
    <p>Please check your internet connection to access live booking, reports, and real-time appointment scheduling.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Try Reconnecting</a>
    <div class="phone">
      Need urgent assistance? Call our direct helpline: <br>
      <a href="tel:7982348151">7982348151</a> / <a href="tel:8796645850">8796645850</a>
    </div>
  </div>
</body>
</html>
