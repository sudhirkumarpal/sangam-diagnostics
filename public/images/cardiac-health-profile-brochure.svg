<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3866" />
      <stop offset="100%" stop-color="#072240" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#c1121f" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1200" fill="#f1f5f9" />

  <!-- Top Decorative Header -->
  <rect width="800" height="230" fill="url(#headerGrad)" />
  <circle cx="750" cy="40" r="140" fill="#00a896" opacity="0.15" />
  <circle cx="50" cy="180" r="90" fill="#e63946" opacity="0.1" />

  <!-- Brand Logo & Accreditations Header -->
  <g transform="translate(50, 30)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="70" height="70" rx="16" fill="#ffffff" />
    <text x="35" y="50" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#0b3866" text-anchor="middle">S</text>
    <circle cx="52" cy="24" r="8" fill="#e63946" />

    <!-- Brand Typography -->
    <text x="85" y="32" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">SANGAM DIAGNOSTICS</text>
    <text x="85" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="3">ACCURACY | CLARITY | RELIABLE RESULTS</text>
    <text x="85" y="70" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2dd4bf">NABL ACCREDITED LAB • MC-7078</text>

    <!-- Contact Pill Header -->
    <rect x="490" y="5" width="210" height="60" rx="12" fill="#028090" />
    <text x="595" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" text-anchor="middle">FREE HOME COLLECTION</text>
    <text x="595" y="50" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">8796645850</text>
  </g>

  <!-- Big Banner Title -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="700" height="75" rx="16" fill="url(#accentGrad)" filter="url(#shadow)" />
    <text x="350" y="38" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CARDIAC HEALTH PROFILE</text>
    <text x="350" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffebee" text-anchor="middle" letter-spacing="2">ADVANCED HEART WELLNESS &amp; CARDIOVASCULAR RISK PANEL</text>
  </g>

  <!-- Pricing Card Grid -->
  <g transform="translate(50, 230)">
    <!-- Left Price Box -->
    <rect x="0" y="0" width="340" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="340" height="30" rx="14" fill="#0b3866" />
    <text x="170" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">SINGLE PERSON OFFER</text>
    <text x="170" y="68" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#0b3866" text-anchor="middle">&#8377;1,299/-</text>
    <text x="170" y="88" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">MRP <tspan text-decoration="line-through">&#8377;3,200</tspan> • SAVE 59%</text>

    <!-- Right Price Box -->
    <rect x="360" y="0" width="340" height="100" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
    <rect x="360" y="0" width="340" height="30" rx="14" fill="url(#badgeGrad)" />
    <text x="530" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">COUPLE / 2 PERSONS OFFER</text>
    <text x="530" y="68" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#00a896" text-anchor="middle">&#8377;2,399/-</text>
    <text x="530" y="88" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">TOTAL VALUE &#8377;6,400 • SAVE 63%</text>
  </g>

  <!-- Included Investigations Core Content -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="700" height="670" rx="20" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />

    <!-- Card Header -->
    <rect x="0" y="0" width="700" height="50" rx="18" fill="#0b3866" />
    <text x="350" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">COMPLETE CLINICAL INVESTIGATIONS (36 KEY PARAMETERS)</text>

    <!-- Test Section 1: Lipid Profile -->
    <g transform="translate(30, 70)">
      <circle cx="16" cy="16" r="16" fill="#fee2e2" />
      <text x="16" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ef4444" text-anchor="middle">&#10084;</text>
      <text x="45" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b3866">1. Complete Lipid Profile (8 Parameters)</text>
      <text x="45" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Total Cholesterol • HDL Good Cholesterol • LDL Bad Cholesterol
      </text>
      <text x="45" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Triglycerides • VLDL • Total Cholesterol/HDL Ratio • LDL/HDL Ratio
      </text>
      <line x1="0" y1="80" x2="640" y2="80" stroke="#e2e8f0" stroke-width="1.5" />
    </g>

    <!-- Test Section 2: Cardiac Inflammation -->
    <g transform="translate(30, 170)">
      <circle cx="16" cy="16" r="16" fill="#fef3c7" />
      <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#d97706" text-anchor="middle">&#9889;</text>
      <text x="45" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b3866">2. Cardiac Risk &amp; Inflammation Markers</text>
      <text x="45" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • High-Sensitivity C-Reactive Protein (Hs-CRP) / CRP Quantitative
      </text>
      <text x="45" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Atherogenic Index of Plasma (Coronary Artery Disease Risk)
      </text>
      <line x1="0" y1="80" x2="640" y2="80" stroke="#e2e8f0" stroke-width="1.5" />
    </g>

    <!-- Test Section 3: Blood Sugar & HbA1c -->
    <g transform="translate(30, 270)">
      <circle cx="16" cy="16" r="16" fill="#e0f2fe" />
      <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0284c7" text-anchor="middle">&#127852;</text>
      <text x="45" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b3866">3. Blood Glucose &amp; Glycemic Control</text>
      <text x="45" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Fasting Blood Glucose (GOD-POD Method)
      </text>
      <text x="45" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Diabetic Micro-Vascular Risk Assessment
      </text>
      <line x1="0" y1="80" x2="640" y2="80" stroke="#e2e8f0" stroke-width="1.5" />
    </g>

    <!-- Test Section 4: Kidney & Electrolytes -->
    <g transform="translate(30, 370)">
      <circle cx="16" cy="16" r="16" fill="#f3e8ff" />
      <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#9333ea" text-anchor="middle">&#128717;</text>
      <text x="45" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b3866">4. Kidney Function &amp; Fluid Electrolytes</text>
      <text x="45" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Blood Urea • Serum Creatinine • Blood Urea Nitrogen (BUN)
      </text>
      <text x="45" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • eGFR Filtration Rate • Serum Calcium • Uric Acid
      </text>
      <line x1="0" y1="80" x2="640" y2="80" stroke="#e2e8f0" stroke-width="1.5" />
    </g>

    <!-- Test Section 5: Complete Blood Count (CBC) & ESR -->
    <g transform="translate(30, 470)">
      <circle cx="16" cy="16" r="16" fill="#ccfbf1" />
      <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0d9488" text-anchor="middle">&#128202;</text>
      <text x="45" y="22" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#0b3866">5. Complete Blood Count (CBC) &amp; ESR</text>
      <text x="45" y="44" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • Haemoglobin • TLC • DLC (5 Part) • Platelet Count • PCV • MCV
      </text>
      <text x="45" y="64" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">
        • MCH • MCHC • RDW-CV • ESR (Erythrocyte Sedimentation Rate)
      </text>
      <line x1="0" y1="80" x2="640" y2="80" stroke="#e2e8f0" stroke-width="1.5" />
    </g>

    <!-- Value Badges -->
    <g transform="translate(20, 580)">
      <rect x="0" y="0" width="155" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="77" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0b3866" text-anchor="middle">100% AUTOMATED</text>
      <text x="77" y="46" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Beckman Coulter</text>

      <rect x="168" y="0" width="155" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="245" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0b3866" text-anchor="middle">ONE PRICK POLICY</text>
      <text x="245" y="46" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Vacuum Needles</text>

      <rect x="336" y="0" width="155" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="413" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0b3866" text-anchor="middle">SAME DAY REPORT</text>
      <text x="413" y="46" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">By 9 PM Online</text>

      <rect x="504" y="0" width="155" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="581" y="26" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#00a896" text-anchor="middle">FREE HOME VISIT</text>
      <text x="581" y="46" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0d9488" text-anchor="middle">No Extra Charges</text>
    </g>
  </g>

  <!-- Bottom Location & Authority Footer -->
  <g transform="translate(50, 1040)">
    <rect x="0" y="0" width="700" height="120" rx="18" fill="url(#headerGrad)" filter="url(#shadow)" />

    <!-- Location Info -->
    <text x="30" y="38" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#2dd4bf" letter-spacing="1">GREATER NOIDA COLLECTION CENTRE &amp; LAB:</text>
    <text x="30" y="60" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Shop No: 02, Paramount Golf Forest Main Market, Greater Noida (UP)</text>
    <text x="30" y="82" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Central Lab: Gali No. 3, New Chandrawal, Delhi - 110007</text>
    <text x="30" y="102" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Medical Signatory: Dr. Anil Gupta (M.D. Pathology | Reg. 5015)</text>

    <!-- Direct Booking Call to Action -->
    <rect x="470" y="25" width="200" height="70" rx="14" fill="#00a896" />
    <text x="570" y="50" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#e0f2fe" text-anchor="middle">CALL / WHATSAPP ARYAN SAINI</text>
    <text x="570" y="76" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">8796645850</text>
  </g>
</svg>
