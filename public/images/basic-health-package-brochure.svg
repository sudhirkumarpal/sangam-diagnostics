        <text x="175" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Verified digital reports delivered via WhatsApp &amp; Portal by 9 PM</text>

        <text x="10" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0d9488">&#10004; Pain-Free Phlebotomy:</text>
        <text x="175" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Experienced technicians with strict One-Prick safety policy</text>

        <text x="10" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0d9488">&#10004; Smart Trend History:</text>
        <text x="175" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">Compare your current results with past tests on our patient portal</text>
