      <text x="77" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Complete Body Check</text>

      <rect x="168" y="0" width="155" height="55" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="245" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">10-12 HR FASTING</text>
      <text x="245" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Water Permitted</text>

      <rect x="336" y="0" width="155" height="55" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="413" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0f172a" text-anchor="middle">SAME DAY REPORT</text>
      <text x="413" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">By 9 PM Online</text>

      <rect x="504" y="0" width="155" height="55" rx="12" fill="#ffffff" stroke="#cbd5e1" />
      <text x="581" y="24" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#0d9488" text-anchor="middle">FREE HOME VISIT</text>
      <text x="581" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">No Extra Charge</text>
