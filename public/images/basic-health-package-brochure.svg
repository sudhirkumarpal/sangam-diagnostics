      <text x="45" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Sugar Fasting (Glucose)</text>
      <text x="45" y="36" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Precision hexokinase method for diabetes screening.</text>
      <line x1="0" y1="46" x2="300" y2="46" stroke="#e2e8f0" stroke-width="1" />
