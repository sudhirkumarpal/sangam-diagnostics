    <linearGradient id="basicBannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="basicBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
