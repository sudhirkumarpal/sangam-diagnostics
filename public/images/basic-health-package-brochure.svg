      <text x="16" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#16a34a" text-anchor="middle">01</text>
      <text x="45" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">CBC (Complete Blood Count)</text>
      <text x="45" y="36" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">24 parameters: Hb, TLC, DLC, Platelets, RBC, MCV, MCH, PCV.</text>
      <line x1="0" y1="46" x2="300" y2="46" stroke="#e2e8f0" stroke-width="1" />
    </g>

    <g transform="translate(30, 125)">
      <circle cx="16" cy="16" r="16" fill="#f0fdf4" />
      <text x="16" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#16a34a" text-anchor="middle">02</text>
      <text x="45" y="18" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#0f172a">ESR (Sedimentation Rate)</text>
      <text x="45" y="36" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b">Westergren automated index for body inflammation.</text>
      <line x1="0" y1="46" x2="300" y2="46" stroke="#e2e8f0" stroke-width="1" />
