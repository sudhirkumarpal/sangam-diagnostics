    <rect x="0" y="0" width="700" height="680" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />

    <rect x="0" y="0" width="700" height="40" rx="16" fill="#f1f5f9" />
