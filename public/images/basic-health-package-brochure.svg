    <text x="585" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ccfbf1" text-anchor="middle">FREE HOME COLLECTION</text>
    <text x="585" y="50" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#ffffff" text-anchor="middle">8796645850</text>
  </g>

