    <text x="30" y="58" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Shop No: PF-02, Paramount Golf Foreste Main Market, Greater Noida (UP)</text>
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Central Lab: Gali No. 3, New Chandrawal, Near Kamla Nagar, Delhi - 110007</text>
